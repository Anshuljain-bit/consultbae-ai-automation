services:
  mysql:
    image: mysql:8.4
    container_name: consultbae-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: consultbae_assignment
      MYSQL_USER: consultbae
      MYSQL_PASSWORD: consultbae
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uconsultbae", "-pconsultbae"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
